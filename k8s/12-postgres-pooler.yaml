# PgBouncer delante de PostgreSQL, administrado por CloudNativePG (recurso Pooler).
#
# Los servicios se conectan a medicitas-db-pooler-rw, no a la base. Cada copia de un servicio abre hasta 10 conexiones
# (el pool de packages/common/src/db.js) contra PgBouncer, que son baratas; PgBouncer las reparte sobre pocas conexiones
# reales a PostgreSQL. Así, que agenda escale a muchas copias con el HPA (paso 3) no agota las conexiones de la base.
#
# Modo transacción: una conexión real se presta solo mientras dura una transacción. Es compatible con el código porque
# todo pasa por withTransaction, que usa SET LOCAL ROLE (dura hasta el COMMIT). Con SET ROLE sin LOCAL, el rol quedaría
# pegado a la conexión real y lo heredaría la petición siguiente: por eso está prohibido (AGENTS.md).
#
# La autenticación la configura el operador: crea el usuario cnpg_pooler_pgbouncer y la función user_search en la base
# postgres, con la que PgBouncer verifica las contraseñas de mc_admin_svc, mc_agenda_svc y mc_clinical_svc.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: medicitas-db-pooler-rw
  namespace: medicitas
spec:
  cluster:
    name: medicitas-db
  type: rw
  # Dos copias de PgBouncer, para que no sea un punto único de falla.
  instances: 2
  pgbouncer:
    poolMode: transaction
    parameters:
      # Conexiones reales por cada par (usuario, base) y por cada copia de PgBouncer. Con 2 copias, admin y clinical
      # usan como máximo 2 × 10 = 20 conexiones reales, su CONNECTION LIMIT (db/init/00-init.sh). agenda tiene su propio
      # Pooler con más conexiones (k8s/13-postgres-pooler-agenda.yaml), porque en el paso 3 este se le quedaba corto.
      default_pool_size: "10"
      # Conexiones de clientes (las copias de los servicios) que acepta cada PgBouncer. Son baratas: 1000 alcanzan
      # para 100 copias de agenda con su pool de 10.
      max_client_conn: "1000"
      # Failover (paso 4, docs/diseno-servicios.md §7). Cuando la principal cae, PgBouncer pierde sus conexiones reales:
      #   - server_login_retry: cuánto espera para volver a intentar conectarse a la base después de un intento fallido.
      #     Con los 15 s por defecto, la API seguía respondiendo 503 hasta ~13 s después de la promoción; con 1 s volvió
      #     entre 0 y 3 s después (k8s/failover-test.sh, 2026-11-12).
      #   - tcp_user_timeout: cuántos milisegundos puede quedar sin confirmar lo enviado por una conexión antes de que el
      #     sistema operativo la corte. Una instancia que muere de golpe no avisa que cerró; sin este límite, PgBouncer
      #     podría esperar en esa conexión muerta los minutos que tarda TCP en rendirse. Con los dos parámetros, la
      #     petición más lenta del corte bajó de ~30 s a ~20 s y terminó en 200: esperó en la fila de PgBouncer hasta
      #     que llegó la nueva principal.
      server_login_retry: "1"
      tcp_user_timeout: "5000"
