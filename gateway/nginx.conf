# Gateway de MediCitas: la única puerta de entrada de la API.
#
# Solo enruta por el inicio de la ruta. No valida tokens (cada servicio lo hace por su cuenta, como
# defensa en profundidad) ni guarda nada. El mismo archivo sirve en Compose y en Kubernetes, donde se
# carga como ConfigMap, porque los servicios se llaman igual en los dos: admin, agenda y clinical.
#
# Los nombres de los servicios se resuelven una sola vez, al arrancar. En Kubernetes la dirección de
# un Service no cambia. En Compose, si se recrea el contenedor de un servicio, su dirección puede
# cambiar (Docker a veces reutiliza la misma); si cambia, hay que reiniciar el gateway
# (docker compose restart gateway).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    # keepalive: conexiones abiertas que se reutilizan hacia cada servicio, en vez de abrir una
    # conexión nueva por cada petición.
    upstream admin {
        server admin:3000;
        keepalive 16;
    }
    upstream agenda {
        server agenda:3000;
        keepalive 32;
    }
    upstream clinical {
        server clinical:3000;
        keepalive 16;
    }

    server {
        listen 3000;
        client_max_body_size 1m;

        # Necesario para reutilizar las conexiones de los upstream.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Datos de la petición original que el servicio no vería de otra forma.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dentro de la red una conexión sana tarda milisegundos. Sin este límite, Nginx espera hasta 60 s a un
        # servicio caído y el cliente queda colgado; con él, responde 503 enseguida.
        proxy_connect_timeout 2s;

        # Si el servicio no responde, el error sale en JSON como el resto de la API.
        error_page 502 503 504 = @unavailable;

        # /me y /health siguen en admin, donde estaban antes del gateway.
        location ~ ^/(clinics|users|services|professionals|me|health)(/|$) {
            proxy_pass http://admin;
        }
        location ~ ^/(schedules|blockades|availability|appointments|agenda|reports)(/|$) {
            proxy_pass http://agenda;
        }
        location ~ ^/(patients|clinical-notes|audit)(/|$) {
            proxy_pass http://clinical;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"Ruta no encontrada"}';
        }

        location @unavailable {
            default_type application/json;
            return 503 '{"error":"Servicio no disponible"}';
        }
    }
}
